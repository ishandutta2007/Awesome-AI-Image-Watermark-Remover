<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#181e36" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
    
    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes scanMove {
      0% { transform: translateX(-150px); }
      50% { transform: translateX(850px); }
      100% { transform: translateX(-150px); }
    }
    @keyframes floatChip1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatChip2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }

    .bg-pulse-cyan {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 150px;
    }
    .bg-pulse-purple {
      animation: pulseGlow 8s ease-in-out infinite 1s;
      transform-origin: 950px 200px;
    }
    .scanner-line {
      animation: scanMove 7s ease-in-out infinite;
    }
    .chip-1 { animation: floatChip1 4s ease-in-out infinite; }
    .chip-2 { animation: floatChip2 5s ease-in-out infinite 0.5s; }
    .chip-3 { animation: floatChip1 4.5s ease-in-out infinite 1s; }
    .chip-4 { animation: floatChip2 5.5s ease-in-out infinite 1.5s; }
    .chip-5 { animation: floatChip1 4.2s ease-in-out infinite 0.8s; }
    
    .tech-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <circle cx="220" cy="120" r="180" fill="url(#cyanGlow)" class="bg-pulse-cyan" />
  <circle cx="980" cy="220" r="220" fill="url(#purpleGlow)" class="bg-pulse-purple" />

  <!-- Subtle Neural Grid Pattern Lines (Background Layer) -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="880" y1="0" x2="880" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Decorative Scanner Track & Beam in background -->
  <g opacity="0.35">
    <rect x="200" y="325" width="800" height="3" rx="1.5" fill="#1b2a4a" />
    <g class="scanner-line">
      <rect x="200" y="324" width="150" height="5" rx="2.5" fill="url(#scanBeam)" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle (Guaranteed in front, zero overlap) -->
  <g class="tech-font" filter="url(#shadowFilter)">
    <!-- Top Pill Category Tag -->
    <g transform="translate(600, 52)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#10192e" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" fill="#00f2fe" font-size="12" font-weight="700" letter-spacing="2">
        ✦ DEEP LEARNING INPAINTING &amp; RESTORATION ✦
      </text>
    </g>

    <!-- Main Title (Never obscured) -->
    <text x="600" y="132" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glowFilter)">
      Awesome AI Image Watermark Remover
    </text>

    <!-- Subtitle (Never obscured) -->
    <text x="600" y="174" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="500" letter-spacing="0.3">
      Curated Landscape of SOTA Inpainting, Content-Aware Erasure &amp; Pixel Reconstruction
    </text>

    <text x="600" y="202" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">
      Comparing Production-Ready SaaS Platforms &amp; Self-Hosted Open-Source Frameworks
    </text>

    <!-- Dynamic Interactive Badges (Pills) Positioned Cleanly Below Typography -->
    <g transform="translate(600, 260)">
      <!-- Chip 1: LaMa Inpainting -->
      <g transform="translate(-390, 0)" class="chip-1">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#141c33" stroke="#4facfe" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#70c4ff" font-size="12" font-weight="600">⚡ LaMa Inpaint</text>
      </g>

      <!-- Chip 2: IOPaint -->
      <g transform="translate(-195, 0)" class="chip-2">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#141c33" stroke="#c77dff" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#d9a8ff" font-size="12" font-weight="600">🎨 IOPaint SOTA</text>
      </g>

      <!-- Chip 3: Stable Diffusion -->
      <g transform="translate(0, 0)" class="chip-3">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#141c33" stroke="#00f2fe" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#00f2fe" font-size="12" font-weight="600">✨ Diffusion Erasure</text>
      </g>

      <!-- Chip 4: Face Restoration -->
      <g transform="translate(195, 0)" class="chip-4">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#141c33" stroke="#e0aaff" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#eed3ff" font-size="12" font-weight="600">👤 GFPGAN / CodeFormer</text>
      </g>

      <!-- Chip 5: Batch Processing -->
      <g transform="translate(390, 0)" class="chip-5">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#141c33" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">🚀 Batch SaaS &amp; APIs</text>
      </g>
    </g>

    <!-- Bottom Indicator Pill -->
    <g transform="translate(600, 315)">
      <circle cx="-140" cy="0" r="4" fill="#10b981" />
      <text x="-128" y="4" fill="#94a3b8" font-size="12" font-weight="500">Live Benchmarks</text>
      <circle cx="-25" cy="0" r="4" fill="#38bdf8" />
      <text x="-13" y="4" fill="#94a3b8" font-size="12" font-weight="500">Open-Source &amp; Commercial</text>
      <circle cx="100" cy="0" r="4" fill="#f59e0b" />
      <text x="112" y="4" fill="#94a3b8" font-size="12" font-weight="500">Regularly Updated</text>
    </g>
  </g>
</svg>
